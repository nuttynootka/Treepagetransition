:root {
  --bg: #0f1011;
  --fg: #ece8e1;
  --muted: #a39c90;
  --brass: #d9b77a;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.55 "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
  overflow-x: hidden;
}
